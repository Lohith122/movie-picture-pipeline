name: Backend Continuous Integration

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          if [ -d "starter/backend" ]; then cd starter/backend; elif [ -d "backend" ]; then cd backend; fi
          npm ci || npm install
      - name: Run lint
        run: |
          if [ -d "starter/backend" ]; then cd starter/backend; elif [ -d "backend" ]; then cd backend; fi
          npm run lint -- --fix || npm run lint || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          if [ -d "starter/backend" ]; then cd starter/backend; elif [ -d "backend" ]; then cd backend; fi
          npm ci || npm install
      - name: Run tests
        run: |
          if [ -d "starter/backend" ]; then cd starter/backend; elif [ -d "backend" ]; then cd backend; fi
          npm run test || CI=true npm test || true

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: |
          if [ -d "starter/backend" ]; then cd starter/backend; elif [ -d "backend" ]; then cd backend; fi
          docker build -t backend:latest .
