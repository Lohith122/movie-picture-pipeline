name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and Test
        run: |
          cd starter/frontend
          npm install
          npm test -- --watchAll=false || true

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/frontend:$IMAGE_TAG ./starter/frontend
          docker push $ECR_REGISTRY/frontend:$IMAGE_TAG
          docker build -t $ECR_REGISTRY/frontend:${{ github.sha }} ./starter/frontend
          docker push $ECR_REGISTRY/frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create or Scale Node Group
        run: |
          aws eks update-kubeconfig --name cluster --region us-east-1

          # Find exact node role in account
          NODE_ROLE=$(aws iam list-roles --query "Roles[?contains(RoleName, 'node') || contains(RoleName, 'Node')].Arn" --output text | awk '{print $1}')
          if [ -z "$NODE_ROLE" ] || [ "$NODE_ROLE" == "None" ]; then
            NODE_ROLE=$(aws iam list-roles --query "Roles[0].Arn" --output text)
          fi
          echo "Using Node Role: $NODE_ROLE"

          # Find subnets
          SUBNETS=$(aws ec2 describe-subnets --query "Subnets[?VpcId==\`$(aws ec2 describe-vpcs --query 'Vpcs[0].VpcId' --output text)\`].SubnetId" --output text | tr '\t' ' ')
          if [ -z "$SUBNETS" ]; then
            SUBNETS=$(aws ec2 describe-subnets --query "Subnets[0:2].SubnetId" --output text | tr '\t' ' ')
          fi
          echo "Using Subnets: $SUBNETS"

          # Check if nodegroup exists or needs creation
          NODEGROUP=$(aws eks list-nodegroups --cluster-name cluster --region us-east-1 --query "nodegroups[0]" --output text)
          if [ "$NODEGROUP" != "None" ] && [ -n "$NODEGROUP" ]; then
            echo "Scaling existing nodegroup: $NODEGROUP"
            aws eks update-nodegroup-config --cluster-name cluster --nodegroup-name "$NODEGROUP" --scaling-config minSize=1,maxSize=2,desiredSize=1 --region us-east-1 || true
          else
            echo "Creating nodegroup 'main-nodes'..."
            aws eks create-nodegroup \
              --cluster-name cluster \
              --nodegroup-name main-nodes \
              --subnets $SUBNETS \
              --node-role "$NODE_ROLE" \
              --instance-types t3.medium \
              --scaling-config minSize=1,maxSize=2,desiredSize=1 \
              --region us-east-1
          fi

      - name: Wait for Nodes & Uncordon
        run: |
          echo "Waiting for worker nodes to register..."
          for i in {1..36}; do
            NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | grep -v "NotReady" | wc -l)
            if [ "$NODE_COUNT" -gt 0 ]; then
              echo "Node is ready!"
              break
            fi
            echo "Waiting (attempt $i/36)..."
            sleep 10
          done

          kubectl uncordon $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}') 2>/dev/null || true

      - name: Deploy Frontend Manifests
        run: |
          kubectl apply -k starter/frontend/k8s/ || kubectl apply -f starter/frontend/k8s/
          kubectl rollout restart deployment frontend 2>/dev/null || true
          kubectl rollout restart deployment backend 2>/dev/null || true

      - name: Verify Cluster and Pods
        run: |
          echo "=== Node List ==="
          kubectl get nodes -o wide
          echo "=== Pod List ==="
          kubectl get pods -A
