name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and Test
        run: |
          cd starter/frontend
          npm install
          npm test -- --watchAll=false || true

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/frontend:$IMAGE_TAG ./starter/frontend
          docker push $ECR_REGISTRY/frontend:$IMAGE_TAG
          docker build -t $ECR_REGISTRY/frontend:${{ github.sha }} ./starter/frontend
          docker push $ECR_REGISTRY/frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --name cluster --region us-east-1

      - name: Uncordon Nodes
        run: |
          kubectl uncordon $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}') || true

      - name: Deploy Frontend Manifests
        run: |
          kubectl apply -k starter/frontend/k8s/ || kubectl apply -f starter/frontend/k8s/
          kubectl rollout restart deployment frontend 2>/dev/null || true

      - name: Verify Cluster and Pods
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A
