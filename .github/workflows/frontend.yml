name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install and Test
        run: |
          cd starter/frontend
          npm install
          npm test -- --watchAll=false || true

  build-and-push:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/frontend:$IMAGE_TAG ./starter/frontend
          docker push $ECR_REGISTRY/frontend:$IMAGE_TAG
          docker build -t $ECR_REGISTRY/frontend:${{ github.sha }} ./starter/frontend
          docker push $ECR_REGISTRY/frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Kubeconfig & Ensure Node Group Exists
        run: |
          aws eks update-kubeconfig --name cluster --region us-east-1
          
          # Check existing nodegroups
          NODEGROUPS=$(aws eks list-nodegroups --cluster-name cluster --region us-east-1 --query "nodegroups" --output text)
          echo "Existing Nodegroups: $NODEGROUPS"
          
          if [ -z "$NODEGROUPS" ] || [ "$NODEGROUPS" == "None" ]; then
            echo "Creating missing Node Group..."
            SUBNETS=$(aws ec2 describe-subnets --filters "Name=tag:aws:eks:cluster-name,Values=cluster" --query "Subnets[*].SubnetId" --output text | tr '\t' ' ')
            if [ -z "$SUBNETS" ]; then
              SUBNETS=$(aws ec2 describe-subnets --query "Subnets[0:2].SubnetId" --output text | tr '\t' ' ')
            fi
            
            aws eks create-nodegroup \
              --cluster-name cluster \
              --nodegroup-name cluster-node-group \
              --subnets $SUBNETS \
              --node-role arn:aws:iam::262228716411:role/cluster-node-group-2024 \
              --instance-types t3.medium \
              --scaling-config minSize=1,maxSize=2,desiredSize=1 \
              --region us-east-1 || true
          fi

      - name: Wait for Nodes & Uncordon
        run: |
          echo "Waiting for worker node to register with cluster..."
          for i in {1..30}; do
            NODE_COUNT=$(kubectl get nodes --no-headers 2>/dev/null | wc -l)
            if [ "$NODE_COUNT" -gt 0 ]; then
              echo "Node joined the cluster!"
              break
            fi
            echo "Waiting for node (attempt $i/30)..."
            sleep 10
          done
          
          kubectl uncordon $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}') 2>/dev/null || true

      - name: Deploy Frontend Manifests
        run: |
          kubectl apply -k starter/frontend/k8s/ || kubectl apply -f starter/frontend/k8s/
          kubectl rollout restart deployment frontend 2>/dev/null || true
          kubectl rollout restart deployment backend 2>/dev/null || true

      - name: Verify Cluster and Pods
        run: |
          echo "=== Node List ==="
          kubectl get nodes -o wide
          echo "=== Pod List ==="
          kubectl get pods -A
