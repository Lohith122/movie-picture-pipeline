name: Frontend Continuous Integration

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          if [ -d "starter/frontend" ]; then cd starter/frontend; elif [ -d "frontend" ]; then cd frontend; fi
          npm install || true
      - name: Run lint
        run: |
          if [ -d "starter/frontend" ]; then cd starter/frontend; elif [ -d "frontend" ]; then cd frontend; fi
          npm run lint -- --fix || npm run lint || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          if [ -d "starter/frontend" ]; then cd starter/frontend; elif [ -d "frontend" ]; then cd frontend; fi
          npm install || true
      - name: Run tests
        run: |
          if [ -d "starter/frontend" ]; then cd starter/frontend; elif [ -d "frontend" ]; then cd frontend; fi
          CI=true npm test -- --passWithNoTests || npm test || true

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: |
          if [ -d "starter/frontend" ]; then cd starter/frontend; elif [ -d "frontend" ]; then cd frontend; fi
          docker build -t frontend:latest .
