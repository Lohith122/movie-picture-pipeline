name: Backend Continuous Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          if [ -d "starter/backend" ]; then cd starter/backend; elif [ -d "backend" ]; then cd backend; fi
          pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run lint
        run: |
          if [ -d "starter/backend" ]; then cd starter/backend; elif [ -d "backend" ]; then cd backend; fi
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

  deploy:
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: backend
          IMAGE_TAG: latest
        run: |
          if [ -d "starter/backend" ]; then cd starter/backend; elif [ -d "backend" ]; then cd backend; fi
          
          echo "=== Backend directory structure ==="
          find . -maxdepth 3
          
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EKS & Verify
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws eks update-kubeconfig --name cluster --region us-east-1
          if [ -d "starter/backend/k8s" ]; then kubectl apply -k starter/backend/k8s/; elif [ -d "k8s" ]; then kubectl apply -k k8s/; fi

          kubectl set image deployment/backend backend=$ECR_REGISTRY/backend:latest || true
          kubectl rollout restart deployment/backend
          
          echo "Waiting 35s for rollout..."
          sleep 35

          echo "==================== POD STATUS ===================="
          kubectl get pods -o wide

          echo "==================== BACKEND LOGS ===================="
          kubectl logs deployment/backend --all-containers=true --tail=20 || true
